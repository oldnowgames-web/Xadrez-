<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Xadrez 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="loading">Carregando modelos 3D...</div>

  <div id="menu" class="overlay">
    <div class="card">
      <h1>XADREZ</h1>
      <button class="btn" onclick="abrirModos()">JOGAR</button>
    </div>
  </div>

  <div id="modos" class="overlay escondido">
    <div class="card">
      <h1>Modo de Jogo</h1>
      <div class="modos">
        <button class="btn btn-modo" onclick="startGame('pvp')">
          <svg viewBox="0 0 64 64"><circle cx="18" cy="16" r="9"/><path d="M4 48c0-10 6-16 14-16s14 6 14 16"/><circle cx="46" cy="16" r="9"/><path d="M32 48c0-10 6-16 14-16s14 6 14 16"/></svg>
          2 Jogadores
        </button>
        <button class="btn btn-modo" onclick="abrirDificuldade()">
          <svg viewBox="0 0 64 64"><circle cx="18" cy="16" r="9"/><path d="M4 48c0-10 6-16 14-16s14 6 14 16"/><rect x="36" y="10" width="22" height="18" rx="3"/><circle cx="43" cy="19" r="2.5"/><circle cx="51" cy="19" r="2.5"/><path d="M40 36h14l4 14H36z"/><rect x="42" y="28" width="10" height="6" rx="1"/></svg>
          Vs Computador
        </button>
      </div>
      <button class="btn" onclick="voltarMenu()">Voltar</button>
    </div>
  </div>

  <div id="dificuldade" class="overlay escondido">
    <div class="card">
      <h2>Dificuldade</h2>
      <div class="dificuldades">
        <button class="btn btn-diff" onclick="startGame('bot','easy')">Fácil</button>
        <button class="btn btn-diff" onclick="startGame('bot','medium')">Médio</button>
        <button class="btn btn-diff" onclick="startGame('bot','hard')">Difícil</button>
      </div>
      <button class="btn" onclick="voltarModos()">Voltar</button>
    </div>
  </div>

  <div id="fim" class="overlay escondido">
    <div class="card">
      <h1 id="titulo-fim">Fim de Jogo</h1>
      <p id="msg-fim" style="color:#3d2410;margin-bottom:16px;"></p>
      <button class="btn" onclick="reiniciar()">Jogar Novamente</button>
      <button class="btn" onclick="voltarMenu()">Menu</button>
    </div>
  </div>

  <div id="hud">
    <div class="timers">
      <div class="timer-box" id="timer-black">
        <div class="timer-piece black"></div>
        <div>
          <div class="timer-label">Pretas</div>
          <div class="timer-time" id="time-black">10:00</div>
        </div>
      </div>
      <div class="timer-box ativo" id="timer-white">
        <div class="timer-piece white"></div>
        <div>
          <div class="timer-label">Brancas</div>
          <div class="timer-time" id="time-white">10:00</div>
        </div>
      </div>
    </div>
    <div class="hud-btns">
      <button class="btn" id="btnFullscreen" onclick="toggleFullscreen()">Fullscreen</button>
      <button class="btn" onclick="reiniciar()">Reiniciar</button>
      <button class="btn" onclick="voltarMenu()">Menu</button>
    </div>
  </div>

  <div id="checkBanner">XEQUE!</div>
  <div id="dica">Arraste para girar • Toque nas peças</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="script.js"></script>
</body>
</html>
